services:
  # Postgres propio solo para desarrollo local: `docker compose --profile local up -d postgres`.
  # En producción el crawler usa la DB de wiauto vía la red externa wiauto-network.
  postgres:
    image: postgres:15-alpine
    container_name: coches_postgres
    profiles: ["local"]
    environment:
      POSTGRES_DB: ${DB_NAME:-coches_db}
      POSTGRES_USER: ${DB_USER:-coches_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-coches_password_dev}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql
    networks:
      - coches_network
    healthcheck:
      # Sin -d, libpq usa como nombre de BD el usuario → intenta "coches_user" y falla.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coches_app
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-4001}
      TZ: ${TZ:-Europe/Madrid}
      # DB de wiauto. Host `postgres` = nombre del servicio en ambos compose del backend
      # (prod: contenedor wiauto-postgres; dev: wiauto-backend-postgres-1).
      # Rol dedicado con permisos mínimos; ver README.
      DATABASE_URL: postgres://${CRAWLER_DB_USER:-wiauto_crawler}:${CRAWLER_DB_PASSWORD:?CRAWLER_DB_PASSWORD requerido}@${WIAUTO_DB_HOST:-postgres}:5432/${WIAUTO_DB_NAME:?WIAUTO_DB_NAME requerido}
      DB_SCHEMA: ${DB_SCHEMA:-crawl}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      # Cron semanal: crawl de catálogo + merge al catálogo de wiauto.
      CATALOG_CRON_ENABLED: ${CATALOG_CRON_ENABLED:-true}
      CATALOG_CRON: ${CATALOG_CRON:-0 3 * * 1}
      CATALOG_CRON_TZ: ${CATALOG_CRON_TZ:-Europe/Madrid}
      SCRAPER_TIMEOUT_MS: ${SCRAPER_TIMEOUT_MS:-30000}
      SCRAPER_RETRY_ATTEMPTS: ${SCRAPER_RETRY_ATTEMPTS:-3}
      SCRAPER_DELAY_MIN_MS: ${SCRAPER_DELAY_MIN_MS:-100}
      SCRAPER_DELAY_MAX_MS: ${SCRAPER_DELAY_MAX_MS:-250}
      SCRAPER_SECTION_ID: ${SCRAPER_SECTION_ID:-2500}
      # Crawl de catálogo en paralelo: modelos simultáneos y tope global de req/s a coches.net.
      SCRAPER_CONCURRENCY: ${SCRAPER_CONCURRENCY:-4}
      SCRAPER_MAX_RPS: ${SCRAPER_MAX_RPS:-8}
      API_BASE_URL: ${API_BASE_URL:-https://web.gw.coches.net}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Playwright / perfil persistente para el crawl de fichas técnicas.
      # headless=false + xvfb-run en el Dockerfile = Chromium "headed" en display virtual.
      PLAYWRIGHT_PROFILE_PATH: ${PLAYWRIGHT_PROFILE_PATH:-/app/playwright-profile}
      PLAYWRIGHT_HEADLESS: ${PLAYWRIGHT_HEADLESS:-false}
      PLAYWRIGHT_NAVIGATION_TIMEOUT_MS: ${PLAYWRIGHT_NAVIGATION_TIMEOUT_MS:-45000}
      PLAYWRIGHT_CHALLENGE_WAIT_MS: ${PLAYWRIGHT_CHALLENGE_WAIT_MS:-20000}
      SPECS_CRAWL_DELAY_MIN_MS: ${SPECS_CRAWL_DELAY_MIN_MS:-500}
      SPECS_CRAWL_DELAY_MAX_MS: ${SPECS_CRAWL_DELAY_MAX_MS:-1500}
      SPECS_MAX_CONSECUTIVE_BOT_ERRORS: ${SPECS_MAX_CONSECUTIVE_BOT_ERRORS:-3}
    # Solo accesible desde el host (endpoints manuales sin auth).
    ports:
      - "127.0.0.1:${CRAWLER_HOST_PORT:-4001}:4001"
    volumes:
      # Volumen nombrado (no bind host) para evitar conflictos de permisos con USER nodejs
      - playwright_profile:/app/playwright-profile
    networks:
      - wiauto-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  playwright_profile:
    driver: local

networks:
  coches_network:
    driver: bridge
  # Red del backend (levantarlo primero):
  #   prod (docker-compose.yml) -> wiauto-network
  #   dev  (dev.yml)            -> wiauto-backend_wiauto-network
  wiauto-network:
    external: true
    name: ${WIAUTO_NETWORK:-wiauto-network}
