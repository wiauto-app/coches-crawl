version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: coches_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-coches_db}
      POSTGRES_USER: ${DB_USER:-coches_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-coches_password_dev}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql
    networks:
      - coches_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-coches_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coches_app
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-3000}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-coches_db}
      DB_USER: ${DB_USER:-coches_user}
      DB_PASSWORD: ${DB_PASSWORD:-coches_password_dev}
      SCRAPER_TIMEOUT_MS: ${SCRAPER_TIMEOUT_MS:-10000}
      SCRAPER_RETRY_ATTEMPTS: ${SCRAPER_RETRY_ATTEMPTS:-3}
      SCRAPER_DELAY_MIN_MS: ${SCRAPER_DELAY_MIN_MS:-500}
      SCRAPER_DELAY_MAX_MS: ${SCRAPER_DELAY_MAX_MS:-1000}
      SCRAPER_SECTION_ID: ${SCRAPER_SECTION_ID:-2500}
      API_BASE_URL: ${API_BASE_URL:-https://vehicle-specs.coches.net}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - coches_network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  coches_network:
    driver: bridge
